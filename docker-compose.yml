services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruangkampus_dev}
      POSTGRES_USER: ${POSTGRES_USER:-ruangkampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ruangkampus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ruangkampus} -d ${POSTGRES_DB:-ruangkampus_dev}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ruangkampus}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${POSTGRES_DB:-ruangkampus_dev}
      APP_ENV: ${APP_ENV:-development}
      ROOM_MEDIA_DIR: /data/room-media
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./.room-media:/data/room-media
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "PYTHONPATH=src alembic upgrade head && uvicorn ruangkampus.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-1}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "${WEB_PORT:-5173}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ruangkampus-postgres:
