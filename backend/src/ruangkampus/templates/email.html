<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f4f6f9;color:#192333;font-family:Arial,Helvetica,sans-serif;">
    <main style="max-width:600px;margin:0 auto;padding:28px;background:#ffffff;border:1px solid #e3e7ed;border-radius:14px;">
      <p style="margin:0 0 16px;color:#173b69;font-size:12px;font-weight:bold;letter-spacing:1.5px;">RUANGKAMPUS</p>
      <h1 style="margin:0 0 16px;font-size:22px;line-height:1.35;">{{ title }}</h1>
      <p style="margin:0;color:#425066;font-size:15px;line-height:1.7;">{{ message_html }}</p>
      {{ action_html }}
      <hr style="margin:28px 0 16px;border:0;border-top:1px solid #e9edf2;">
      <p style="margin:0;color:#7a8697;font-size:12px;line-height:1.5;">Pesan otomatis dari RuangKampus. Jangan membalas email ini.</p>
    </main>
  </body>
</html>
